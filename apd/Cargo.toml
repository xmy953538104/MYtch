[package]
name = "apd"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
csv = "1.3.1"
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
nom = "8"
derive-new = "0.7.0"
getopts = "0.2"
errno = "0.3.14"
notify = "8.2"
signal-hook = "0.4"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["all-apis"] }
# some android specific dependencies which compiles under unix are also listed here for convenience of coding
android-properties = { version = "0.2.2", features = ["bionic-deprecated"] }
procfs = "0.18"
loopdev = { git = "https://github.com/AndroidPatch/loopdev" }
prop-rs-android = { git = "https://github.com/Kernel-SU/ksu_props" }
policy = {git = "https://github.com/AndroidPatch/ap_policy"}
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }

[profile.release]
strip = true
overflow-checks = false
rpath = false
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
